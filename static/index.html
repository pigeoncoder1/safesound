<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>safesound</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    button { font-size: 1rem; padding: 0.5rem 1rem; margin-right: 0.5rem; }
    #status { margin: 1rem 0; color: #555; }
    #log { list-style: none; padding: 0; font-family: ui-monospace, monospace; font-size: 0.9rem; }
    #log li { padding: 0.3rem 0; border-bottom: 1px solid #eee; }
    .known { color: #1a7f37; }
    .unknown { color: #cf222e; font-weight: bold; }
    .muted { color: #888; }
    .transcript { color: #0550ae; }
    .command { color: #8250df; font-weight: bold; }
    .say { color: #1f2328; font-weight: bold; }
    #room { margin: 1rem 0; padding: 0.8rem 1rem; border-radius: 8px; background: #f3f3f3; }
    #room.private { background: #dafbe1; }
    #room.not_private { background: #ffebe9; }
    #room-state { font-size: 1.3rem; font-weight: bold; }
    #room-details { margin-top: 0.3rem; font-size: 0.9rem; color: #333; }
    #call { margin: 1rem 0; padding: 0.8rem 1rem; border-radius: 8px; border: 1px solid #ddd; }
    #call.active { border-color: #0969da; background: #ddf4ff; }
    #call input { font-size: 1rem; padding: 0.4rem; width: 10rem; margin-right: 0.5rem; }
    #call-state { margin-top: 0.5rem; font-size: 0.95rem; }
    .verified { color: #1a7f37; font-weight: bold; }
    .mismatch, .unknown_number { color: #cf222e; font-weight: bold; }
    .pending { color: #9a6700; font-weight: bold; }
  </style>
</head>
<body>
  <h1>safesound</h1>
  <button id="start">Start</button>
  <button id="stop" disabled>Stop</button>
  <button id="say" disabled>Speak test sentence</button>
  <div id="status">Press Start and allow microphone access.</div>
  <div id="room">
    <div id="room-state">Room: not listening</div>
    <div id="room-details"></div>
  </div>
  <div id="call">
    <strong>Simulated phone call</strong><br>
    <input id="caller-id" placeholder="Caller ID (blank = none)">
    <button id="call-start" disabled>Start call</button>
    <button id="call-end" disabled>End call</button>
    <div id="call-state">No call.</div>
  </div>
  <ul id="log"></ul>

  <script type="module">
    import { startAudio } from "/static/audio.js";
    import { speak } from "/static/tts.js";

    const startBtn = document.getElementById("start");
    const stopBtn = document.getElementById("stop");
    const sayBtn = document.getElementById("say");
    const status = document.getElementById("status");
    const log = document.getElementById("log");
    let session = null;
    let room = null;
    let callActive = false;

    const callBox = document.getElementById("call");
    const callerIdInput = document.getElementById("caller-id");
    const callStartBtn = document.getElementById("call-start");
    const callEndBtn = document.getElementById("call-end");
    const callState = document.getElementById("call-state");

    const VERIFICATION_TEXT = {
      pending: "waiting for the caller to speak",
      verified: "verified: voice matches the number",
      mismatch: "MISMATCH: voice does not match the number",
      unknown_number: "unknown number: treated as a stranger",
    };

    function renderCall(e) {
      callActive = e.active;
      callBox.className = e.active ? "active" : "";
      callStartBtn.disabled = !session || e.active;
      callEndBtn.disabled = !session || !e.active;
      callerIdInput.disabled = e.active;
      if (!e.active) {
        callState.textContent = "No call.";
        return;
      }
      const number = e.caller_id ?? "no caller ID";
      const voice = e.voice ?? "not heard yet";
      callState.innerHTML = "";
      callState.append(`Caller ID: ${number} · Voice: ${voice} · `);
      const badge = document.createElement("span");
      badge.className = e.verification;
      badge.textContent = VERIFICATION_TEXT[e.verification] ?? e.verification;
      callState.append(badge);
    }

    function sendJson(obj) {
      if (session && session.ws.readyState === WebSocket.OPEN) session.ws.send(JSON.stringify(obj));
    }

    callStartBtn.onclick = () => sendJson({ type: "call_start", caller_id: callerIdInput.value.trim() || null });
    callEndBtn.onclick = () => sendJson({ type: "call_end" });
    let roomReceivedAt = 0;

    const roomBox = document.getElementById("room");
    const roomState = document.getElementById("room-state");
    const roomDetails = document.getElementById("room-details");

    function renderRoom() {
      if (!room) {
        roomBox.className = "";
        roomState.textContent = "Room: not listening";
        roomDetails.textContent = "";
        return;
      }
      const age = (Date.now() - roomReceivedAt) / 1000;
      const ago = s => `${Math.round(s + age)}s ago`;
      roomBox.className = room.state;
      roomState.textContent = room.state === "private" ? "Room: PRIVATE" : "Room: NOT PRIVATE";
      const owner = room.owner_last_heard === null ? "never" : ago(room.owner_last_heard);
      const voices = room.voices.length
        ? room.voices.map(v => `${v.label} (${ago(v.last_heard_seconds_ago)})`).join(", ")
        : "nobody yet";
      roomDetails.textContent = `Owner last heard: ${owner}. Voices: ${voices}.`;
    }
    setInterval(renderRoom, 1000);

    function addLog(text, cls = "") {
      const li = document.createElement("li");
      li.textContent = `${new Date().toLocaleTimeString()}  ${text}`;
      li.className = cls;
      log.prepend(li);
    }

    function onEvent(e) {
      if (e.type === "connected") status.textContent = `Listening (mic at ${e.sampleRate} Hz, sent at 16000 Hz).`;
      else if (e.type === "closed") {
        status.textContent = "Disconnected.";
        room = null;
        renderRoom();
        renderCall({ active: false });
      }
      else if (e.type === "call") {
        if (e.active !== callActive) addLog(e.active ? `📞 call started (caller ID: ${e.caller_id ?? "none"})` : "📞 call ended", "muted");
        renderCall(e);
      }
      else if (e.type === "room") {
        if (room && room.state !== e.state) addLog(`room is now ${e.state.replace("_", " ")}`, e.state === "private" ? "known" : "unknown");
        room = e;
        roomReceivedAt = Date.now();
        renderRoom();
      }
      else if (e.type === "voice") {
        const note = e.reliable ? "" : "  (short: not used for room)";
        addLog(`${e.label}  score ${e.score.toFixed(3)}  (${e.seconds}s)${note}`, e.label === "unknown" ? "unknown" : "known");
      }
      else if (e.type === "transcript") {
        const who = e.name ? `${e.name} (${e.relationship})` : e.relationship;
        addLog(`${e.channel === "call" ? "📞 " : ""}${who}: "${e.text}"  [${e.path}]`, "transcript");
      }
      else if (e.type === "command") {
        const { type, intent, speaker, channel, ...args } = e;
        const shown = Object.entries(args).filter(([, v]) => v !== null).map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(" ");
        addLog(`→ ${intent}${shown ? " " + shown : ""}`, "command");
      }
      else if (e.type === "say") {
        addLog(`🔊 safesound: "${e.text}"`, "say");
        if (session) speak(e.text, session.ws);
      }
      else if (e.type === "activity") {
        const a = e.entry;
        const who = a.channel === "call"
          ? `📞 ${a.caller_id ?? "no caller ID"} (${a.verification.replace("_", " ")})`
          : (a.name ?? "unrecognised voice");
        const msg = a.message_left ? `  · message: "${a.message_left}"` : "";
        addLog(`📝 logged for owner: ${who} → ${a.intent}${msg}`, a.verification === "mismatch" ? "unknown" : "muted");
      }
      else if (e.type === "digest_delivered") {
        addLog(`📬 told owner about ${e.ids.length} logged interaction${e.ids.length === 1 ? "" : "s"}`, "known");
      }
      else if (e.type === "introduction") {
        const who = e.relationship ? `${e.name} (${e.relationship === "partner" ? "family/partner" : e.relationship})` : e.name;
        const text = {
          asking: `👋 introducing ${who}: asking how they know you`,
          collecting: `👋 learning ${who}'s voice: ${e.seconds.toFixed(1)} / ${e.target} s`,
          done: `👋 remembered ${who}`,
          failed: `👋 couldn't learn ${who}'s voice (only ${e.seconds.toFixed(1)} s)`,
          cancelled: `👋 introduction of ${e.name} cancelled`,
        }[e.stage];
        addLog(text, e.stage === "done" ? "known" : e.stage === "failed" ? "unknown" : "command");
      }
      else if (e.type === "disclosure") {
        const parts = [];
        if (e.disclosed.length) parts.push(`disclosed: ${e.disclosed.join(", ")}`);
        if (e.withheld.length) parts.push(`withheld: ${e.withheld.join(", ")}`);
        if (parts.length) addLog(parts.join("  ·  "), "muted");
      }
      else if (e.type === "tts_start") addLog("assistant speaking: mic ignored", "muted");
      else if (e.type === "tts_end") addLog("assistant finished: listening again", "muted");
    }

    startBtn.onclick = async () => {
      startBtn.disabled = true;
      try {
        session = await startAudio(onEvent);
        stopBtn.disabled = false;
        sayBtn.disabled = false;
      } catch (err) {
        status.textContent = `Could not start: ${err.message}`;
        startBtn.disabled = false;
      }
    };

    stopBtn.onclick = () => {
      session.stop();
      session = null;
      stopBtn.disabled = true;
      sayBtn.disabled = true;
      startBtn.disabled = false;
    };

    sayBtn.onclick = () => speak("This is a test. While I am talking, the microphone is ignored.", session.ws);
  </script>
</body>
</html>
